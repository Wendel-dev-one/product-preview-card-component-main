<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/responsive.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main class="product-preview">
    <div class="product-card">
      <picture>
        <source srcset="images/image-product-mobile.jpg" media="(max-width: 376px)">
        <img class="product-card__image" src="images/image-product-desktop.jpg" alt="Perfume Gabrielle Essence Eau De Parfum da Chanel">
      </picture>

      <div class="product-card__details">
        <p class="product-card__category">Perfume</p>

        <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>

        <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.</p>

        <div class="product-card__pricing">
          <h2 class="product-card__price--current">$149.99</h2>
          <span class="product-card__price--old">$169.99</span>
        </div>

        <button class="product-card__add-to-cart">
          <img class="product-card__cart-icon" src="/images/icon-cart.svg" alt="Ícone de carrinho de compras">
          <span class="product-card__add-label">Add to Cart</span>
        </button>
      </div>
    </div>
  </main>
</body>

</html>
